# Réglages du serveur Cloudflare (déployé automatiquement depuis GitHub)
name = "scan-produit"
main = "worker.js"
compatibility_date = "2025-09-01"

# Adresse publique scan-produit.matth0312.workers.dev activée
workers_dev = true
preview_urls = false

# IA gratuite de Cloudflare, utilisée pour les résumés de livres
[ai]
binding = "AI"

# Mémoire des fiches déjà vues (stockage KV gratuit, créé le 30.10.2026)
[[kv_namespaces]]
binding = "FICHES"
id = "b12b142321804ffdb3d3f5b9c5c06328"

# Profils au prénom, historique synchronisé et statistiques d'usage (base D1 gratuite, créée le 30.10.2026)
[[d1_databases]]
binding = "DB"
database_name = "scan-produit-profils"
database_id = "0ac17ebe-690f-4755-8cb8-5db35687d781"
