<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan produit</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;--bg:#f6f6f4;--card:#fff;--text:#1a1a1a;--muted:#6b6b6b;--accent:#e1a925;--accent-text:#1a1a1a;--line:#ddd;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#222;--text:#f2f2f2;--muted:#9a9a9a;--line:#383838}}
:root[data-theme="dark"]{--bg:#141414;--card:#222;--text:#f2f2f2;--muted:#9a9a9a;--line:#383838}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:16px}
.tabs button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
#reader{width:100%;min-height:160px;border-radius:10px;overflow:hidden;margin-bottom:8px}
.big{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:18px;font-weight:700;text-align:center;text-decoration:none}
input{width:100%;padding:14px;font-size:20px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:10px}
.muted{color:var(--muted);font-size:14px}
.code{font-size:26px;font-weight:700;letter-spacing:1px;margin:4px 0 12px}
ul{list-style:none;padding:0;margin:8px 0 0}
li{padding:10px 0;border-top:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note{font-size:15px;padding:8px 10px;margin:6px 0 8px}
.acts{display:flex;gap:8px}
.acts a,.acts button{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-decoration:none}
.hhead{display:flex;justify-content:space-between;align-items:center}
.saved{color:#2e9e4f;font-size:13px;font-weight:600}
.book{display:flex;gap:12px;margin:4px 0 12px}
.book img{width:72px;height:auto;border-radius:6px;align-self:flex-start;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.book h3{margin:0 0 4px;font-size:17px;line-height:1.25}
.bref{font-size:16px;line-height:1.4;margin:0 0 12px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--bg);border-radius:6px}
.desc{font-size:15px;line-height:1.45;margin:0 0 12px;white-space:pre-line}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0 0 12px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.desc.clip{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;margin:-6px 0 12px;font-size:14px}
.acts button.sel{background:var(--accent);border-color:var(--accent);color:#111;font-weight:600}
.cmpbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.cmpbar .big{box-shadow:0 6px 20px rgba(0,0,0,.3)}
.hhead button{border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:4px}
.hide{display:none}
.opt{display:flex;align-items:center;gap:10px;margin:12px 2px 0;font-size:15px}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
#torch{margin-top:10px}
.top{display:flex;align-items:center;gap:14px;background:#111;color:#fff;margin:-16px -16px 18px;padding:18px 16px;border-bottom:4px solid var(--accent)}
.mark{width:52px;height:52px;border-radius:10px;background:var(--accent);color:#111;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;letter-spacing:-2px}
.ttl{font-size:19px;font-weight:700}
.sub{font-size:12px;color:#bdbdbd;margin-top:2px}
.card{box-shadow:0 2px 12px rgba(0,0,0,.10)}
.big{transition:transform .1s}
.big:active{transform:scale(.98)}
.tabs button{font-weight:600}
.alt{margin-top:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:600;font-size:16px}
</style>
</head>
<body>
<header class="top"><div class="mark">▮▯▮</div><div><div class="ttl">Scan produit</div><div class="sub">Vésenaz · vérification rapide en rayon</div></div></header>
<div class="tabs">
  <button id="t1" class="on" type="button">Scanner</button>
  <button id="t2" type="button">Saisir code</button>
  <button id="t3" type="button">Mots-clés</button>
</div>

<div id="p1">
  <div class="card">
    <div id="reader" class="hide"></div>
    <p class="muted" id="hint">Appuie sur « Scanner en direct », puis vise le code-barres.</p>
    <button class="big" id="start" type="button">Scanner en direct</button>
    <button class="big alt hide" id="torch" type="button">Allumer la lampe</button>
    <button class="big alt" id="pick" type="button">Choisir une photo existante</button>
    <input id="f2" type="file" accept="image/*" class="hide">
    <div id="filereader" class="hide"></div>
    <label class="opt"><input type="checkbox" id="auto"> Ouvrir la fiche dès que le code est lu (sauf livres)</label>
  </div>
</div>

<div id="p2" class="hide">
  <div class="card">
    <input id="sku" inputmode="numeric" enterkeyhint="search" placeholder="SKU (8 chiffres) ou EAN" autocomplete="off">
    <button class="big" id="go" type="button">Rechercher</button>
  </div>
</div>

<div id="p3" class="hide">
  <div class="card">
    <input id="kw" type="search" enterkeyhint="search" placeholder="Ex. casque bose bluetooth" autocomplete="off">
    <a class="big" id="kwGo" target="_blank" rel="noopener">Rechercher sur fnac.ch</a>
  </div>
</div>

<div id="res" class="card hide">
  <div class="muted">Dernier code</div>
  <div class="code" id="code"></div>
  <div id="bookBox" class="hide"></div>
  <a class="big" id="open" target="_blank" rel="noopener">Ouvrir la fiche fnac.ch</a>
  <a class="big alt" id="direct" target="_blank" rel="noopener">Essayer d’ouvrir directement la fiche</a>
  <p class="muted" id="note"></p>
  <a class="big alt" id="ai" target="_blank" rel="noopener">Résumé pour conseiller (Google IA)</a>
</div>

<div id="cmpBar" class="cmpbar hide"><a class="big" id="cmpGo" target="_blank" rel="noopener">Comparer les 2 articles (Google IA)</a></div>

<div id="histCard" class="card hide">
  <div class="hhead"><span class="muted">Historique</span><button id="clr" type="button">Tout effacer</button></div>
  <ul id="hist"></ul>
</div>

<script>
var BASE = "https://www.fr.fnac.ch/SearchResult/ResultList.aspx?Search=";
var scanner = null, running = false, last = "", lastAt = 0;
var $ = function(id){ return document.getElementById(id); };

function tab(n){
  $("p1").className = n === 1 ? "" : "hide";
  $("p2").className = n === 2 ? "" : "hide";
  $("t1").className = n === 1 ? "on" : "";
  $("t2").className = n === 2 ? "on" : "";
  $("p3").className = n === 3 ? "" : "hide";
  $("t3").className = n === 3 ? "on" : "";
}
$("t1").onclick = function(){ tab(1); };
$("t2").addEventListener("click", stop); $("t3").addEventListener("click", stop);
$("t2").onclick = function(){ tab(2); $("sku").focus(); };
$("t3").onclick = function(){ tab(3); $("kw").focus(); };
function kwUrl(){ return BASE + encodeURIComponent($("kw").value.trim()); }
$("kwGo").onclick = function(e){
  if (!$("kw").value.trim()) { e.preventDefault(); $("kw").focus(); return; }
  this.href = kwUrl();
};
$("kw").onkeydown = function(e){
  if (e.key === "Enter" && this.value.trim()) { window.open(kwUrl(), "_blank", "noopener"); }
};

function loadHist(){
  try {
    var h = JSON.parse(localStorage.getItem("hist") || "[]");
    return h.map(function(x){ return typeof x === "string" ? {c: x, t: 0, n: ""} : x; });
  } catch(e){ return []; }
}
function storeHist(h){ try { localStorage.setItem("hist", JSON.stringify(h)); } catch(e){} }
function saveHist(c){
  var h = loadHist(), old = h.filter(function(x){ return x.c === c; })[0];
  h = h.filter(function(x){ return x.c !== c; });
  h.unshift({c: c, t: Date.now(), n: old ? old.n : "", s: old ? old.s : ""});
  h = h.slice(0, 30);
  storeHist(h); renderHist(h);
}
function ago(t){
  if (!t) return "";
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "à l’instant";
  if (m < 60) return "il y a " + m + " min";
  var hh = Math.round(m / 60);
  if (hh < 24) return "il y a " + hh + " h";
  return "il y a " + Math.round(hh / 24) + " j";
}
function renderHist(h){
  $("histCard").className = h.length ? "card" : "card hide";
  setTimeout(renderCmp, 0);
  var ul = $("hist"); ul.innerHTML = "";
  h.forEach(function(x){
    var sku = x.c.indexOf("s:") === 0, code = sku ? x.c.slice(2) : x.c;
    var li = document.createElement("li");
    var top = document.createElement("div"); top.className = "hrow";
    var b = document.createElement("b"); b.textContent = (sku ? "SKU " : (isBook(code) ? "Livre " : "EAN ")) + code;
    var s = document.createElement("span"); s.className = "muted"; s.textContent = ago(x.t);
    var ok = document.createElement("span"); ok.className = "saved";
    top.appendChild(b); top.appendChild(ok); top.appendChild(s); li.appendChild(top);
    var inp = document.createElement("input"); inp.className = "note"; inp.placeholder = "Prix, remarque…"; inp.value = x.n || "";
    inp.oninput = function(){
      var hh = loadHist(); hh.forEach(function(y){ if (y.c === x.c) y.n = inp.value; }); storeHist(hh);
      ok.textContent = "✓ Enregistré"; clearTimeout(ok.tm); ok.tm = setTimeout(function(){ ok.textContent = ""; }, 1500);
    };
    li.appendChild(inp);
    var acts = document.createElement("div"); acts.className = "acts";
    var a1 = document.createElement("a"); a1.href = urlFor(x.c); a1.target = "_blank"; a1.rel = "noopener"; a1.textContent = "Ouvrir";
    var d = document.createElement("button"); d.type = "button"; d.textContent = "Supprimer";
    d.onclick = function(){ var hh = loadHist().filter(function(y){ return y.c !== x.c; }); storeHist(hh); renderHist(hh); };
    var cp = document.createElement("button"); cp.type = "button"; cp.textContent = "Comparer";
    if (cmpSel.indexOf(x.c) > -1) cp.className = "sel";
    cp.onclick = function(){
      var i = cmpSel.indexOf(x.c);
      if (i > -1) cmpSel.splice(i, 1); else { cmpSel.push(x.c); if (cmpSel.length > 2) cmpSel.shift(); }
      renderHist(loadHist());
    };
    acts.appendChild(a1); acts.appendChild(cp); acts.appendChild(d); li.appendChild(acts);
    ul.appendChild(li);
  });
}
var cmpSel = [];
function label(c){ return c.indexOf("s:") === 0 ? "SKU fnac.ch " + c.slice(2) : (isBook(c) ? "ISBN " : "EAN ") + c; }
function claudeUrl(q){ return "https://www.google.com/search?udm=50&hl=fr&q=" + encodeURIComponent(q); }
function noteOf(c){ var x = loadHist().filter(function(y){ return y.c === c; })[0]; return x && x.n ? " (ma note : " + x.n + ")" : ""; }
function promptOne(c){
  if (isBook(c)) return "Livre ISBN " + c + " : fiche rapide pour un libraire, en moins de 120 mots. Titre et auteur, résumé en 2 phrases sans spoiler, de quoi ou de qui ça parle, âge conseillé, date de parution et éditeur, tome si c'est une série, 2 livres similaires.";
  return "Produit " + label(c) + noteOf(c) + " : fiche rapide pour un vendeur Fnac, en moins de 150 mots. Nom exact du produit, 3 points forts, 2 points faibles, pour quel type de client, une alternative à proposer.";
}
function promptCmp(a, b){
  return "Compare ces deux produits pour un vendeur Fnac : (1) " + label(a) + noteOf(a) + " et (2) " + label(b) + noteOf(b) + ". Tableau court des caractéristiques clés et des différences qui comptent vraiment, puis une phrase : lequel conseiller selon le profil du client.";
}
function renderCmp(){
  var h = loadHist().map(function(x){ return x.c; });
  cmpSel = cmpSel.filter(function(c){ return h.indexOf(c) > -1; });
  $("cmpBar").className = cmpSel.length === 2 ? "cmpbar" : "cmpbar hide";
  if (cmpSel.length === 2) $("cmpGo").href = claudeUrl(promptCmp(cmpSel[0], cmpSel[1]));
}

function isBook(c){ return /^97[89]\d{10}$/.test(c); }
var bookReq = 0;
function bookHtml(b){
  var box = $("bookBox"); box.innerHTML = "";
  var wrap = document.createElement("div"); wrap.className = "book";
  if (b.img) { var im = document.createElement("img"); im.src = b.img.replace("http://", "https://"); im.alt = ""; im.onerror = function(){ im.remove(); }; wrap.appendChild(im); }
  var t = document.createElement("div");
  var h3 = document.createElement("h3"); h3.textContent = b.title; t.appendChild(h3);
  if (b.authors) { var m = document.createElement("div"); m.className = "muted"; m.textContent = b.authors; t.appendChild(m); }
  wrap.appendChild(t); box.appendChild(wrap);
  if (b.bref) { var br = document.createElement("p"); br.className = "bref"; br.textContent = b.bref; box.appendChild(br); }
  var dl = document.createElement("dl"); dl.className = "facts";
  [["Public", b.audience], ["Sujet", b.sujet], ["Parution", b.date], ["Éditeur", b.publisher], ["Pages", b.pages], ["Genre", b.genre], ["Série", b.series]].forEach(function(f){
    if (!f[1]) return;
    var dt = document.createElement("dt"); dt.textContent = f[0];
    var dd = document.createElement("dd"); dd.textContent = f[1];
    dl.appendChild(dt); dl.appendChild(dd);
  });
  if (dl.children.length) box.appendChild(dl);
  var p = document.createElement("p"); p.className = "desc";
  if (b.desc) {
    p.textContent = b.desc; p.classList.add("clip"); box.appendChild(p);
    var mo = document.createElement("button"); mo.type = "button"; mo.className = "more"; mo.textContent = "Lire la suite";
    mo.onclick = function(){ p.classList.remove("clip"); mo.remove(); };
    box.appendChild(mo);
  } else if (!b.bref) { p.className = "muted"; p.textContent = "Pas de résumé dans la base : le bouton Google IA ci-dessous en fait un."; box.appendChild(p); }
  if (!b.audience) { var a = document.createElement("p"); a.className = "muted"; a.textContent = "Âge conseillé non indiqué dans la base : le bouton Google IA le précise."; box.appendChild(a); }
  box.className = "";
}
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function frDate(s){
  s = String(s || "").trim(); if (!s) return "";
  var m = s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if (m) return (m[3] ? (+m[3]) + " " : "") + MOIS[+m[2] - 1] + " " + m[1];
  return s;
}
function audienceFrom(txt){
  var t = String(txt || "").toLowerCase();
  if (/baby|board book|tout-petit|0-3|1-3 ans/.test(t)) return "Tout-petits (0-3 ans)";
  if (/picture book|album/.test(t)) return "Enfants (3-6 ans)";
  if (/young adult|ado/.test(t)) return "Ados / jeunes adultes";
  if (/juvenile|jeunesse|children|enfant/.test(t)) return "Jeunesse";
  return "";
}
var GENRES = {"juvenile fiction":"Fiction jeunesse","juvenile nonfiction":"Documentaire jeunesse","young adult fiction":"Roman ado","young adult nonfiction":"Documentaire ado",
  "fiction":"Roman","comics & graphic novels":"BD / romans graphiques","cooking":"Cuisine","history":"Histoire","biography & autobiography":"Biographie",
  "self-help":"Développement personnel","business & economics":"Économie / entreprise","science":"Sciences","computers":"Informatique","travel":"Voyage",
  "health & fitness":"Santé / forme","psychology":"Psychologie","philosophy":"Philosophie","religion":"Religion","art":"Art","music":"Musique",
  "sports & recreation":"Sport / loisirs","education":"Éducation","family & relationships":"Famille","poetry":"Poésie","drama":"Théâtre",
  "true crime":"Faits divers","humor":"Humour","political science":"Politique","social science":"Sciences sociales","foreign language study":"Langues",
  "games & activities":"Jeux / activités","literary criticism":"Critique littéraire","nature":"Nature","pets":"Animaux","photography":"Photographie"};
function frGenre(s){ return String(s || "").split(/,\s*/).filter(Boolean).map(function(g){ return GENRES[g.toLowerCase()] || g; }).join(", "); }
function clean(s){ var d = document.createElement("div"); d.innerHTML = String(s || ""); return d.textContent.trim(); }
// Clé Google Books restreinte au site matth0312leb.github.io (sans danger dans une page publique)
var GBOOKS_KEY = "";
var diag = {};
function getJSON(name, url){
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){
    clearTimeout(tm);
    if (!r.ok) { diag[name] = r.status === 429 ? "quota dépassé (429)" : "erreur " + r.status; throw 0; }
    return r;
  }, function(){ clearTimeout(tm); if (!diag[name]) diag[name] = "connexion bloquée ou trop lente"; throw 0; });
}
function fromGoogle(isbn){
  return getJSON("Google Books", "https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn + (GBOOKS_KEY ? "&key=" + GBOOKS_KEY : "")).then(function(r){ return r.json(); }).then(function(j){
    if (!j.items || !j.items.length) { diag["Google Books"] = "aucun résultat"; return null; }
    var v = j.items[0].volumeInfo || {};
    var cats = (v.categories || []).join(", ");
    diag["Google Books"] = "trouvé";
    return { title: v.title + (v.subtitle ? " – " + v.subtitle : ""), authors: (v.authors || []).join(", "),
      date: frDate(v.publishedDate), publisher: v.publisher || "", pages: v.pageCount || "", genre: frGenre(cats),
      audience: audienceFrom(cats), desc: clean(v.description),
      img: v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail) };
  });
}
function fromOpenLib(isbn){
  return getJSON("Open Library", "https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data").then(function(r){ return r.json(); }).then(function(j){
    var v = j["ISBN:" + isbn]; if (!v) { diag["Open Library"] = "aucun résultat"; return null; }
    diag["Open Library"] = "trouvé";
    var subj = (v.subjects || []).map(function(s){ return s.name; }).join(", ");
    return { title: v.title + (v.subtitle ? " – " + v.subtitle : ""), authors: (v.authors || []).map(function(a){ return a.name; }).join(", "),
      date: v.publish_date || "", publisher: (v.publishers || []).map(function(x){ return x.name; }).join(", "),
      pages: v.number_of_pages || "", audience: audienceFrom(subj), desc: "",
      img: v.cover && (v.cover.medium || v.cover.small) };
  });
}
function bnfPerson(s){
  s = String(s || "").replace(/\s*\(.*$/, "").replace(/\.\s.*$/, "").trim();
  var p = s.split(/,\s*/); return p.length === 2 ? p[1] + " " + p[0] : s;
}
function fromBnf(isbn){
  var q = encodeURIComponent('bib.isbn all "' + isbn + '"');
  return getJSON("BnF", "https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&recordSchema=dublincore&maximumRecords=1&query=" + q).then(function(r){ return r.text(); }).then(function(x){
    var d = new DOMParser().parseFromString(x, "text/xml");
    var all = function(tag){ return Array.prototype.map.call(d.getElementsByTagNameNS("*", tag), function(e){ return e.textContent.trim(); }); };
    var t = all("title")[0];
    if (!t) { diag["BnF"] = "aucun résultat"; return null; }
    diag["BnF"] = "trouvé";
    var fmt = all("format").join(" "), pm = fmt.match(/(\d+)\s*p/);
    var pub = (all("publisher")[0] || "").replace(/\s*\(.*\)\s*$/, "").replace(/^.*:\s*/, "");
    var subj = all("subject").join(", ");
    return { title: t.split(" / ")[0].replace(/\s*\[.*?\]\s*/g, " ").trim(), authors: all("creator").map(bnfPerson).filter(Boolean).slice(0, 3).join(", "),
      date: all("date")[0] || "", publisher: pub, pages: pm ? pm[1] : "", genre: "", audience: audienceFrom(subj + " " + fmt),
      desc: all("description").filter(function(s){ return s.length > 80; })[0] || "" };
  });
}
var SERVEUR = "https://scan-produit.matth0312.workers.dev";
function fromServeur(isbn){
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, 20000);
  return fetch(SERVEUR + "/livre?isbn=" + isbn, ctl ? { signal: ctl.signal } : {}).then(function(r){ clearTimeout(tm); return r.json(); }).then(function(j){
    if (!j || !j.trouve) return null;
    var ia = j.ia || {};
    return { title: j.titre, authors: j.auteur, date: /^\d{4}-\d{2}/.test(j.date || "") ? frDate(j.date) : j.date,
      publisher: (j.editeur || "").replace(/^./, function(c){ return c.toUpperCase(); }), pages: j.pages, genre: frGenre(j.genre),
      audience: j.age || ia.public || audienceFrom(j.genre), sujet: ia.sujet || "", bref: ia.resume || "",
      desc: j.description || "", img: j.image || "https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg?default=false" };
  }, function(){ clearTimeout(tm); return null; });
}
function loadBook(isbn){
  var my = ++bookReq; diag = {};
  var box = $("bookBox"); box.className = ""; box.innerHTML = '<p class="muted">Recherche du livre…</p>';
  fromServeur(isbn).catch(function(){ return null; }).then(function(s){
    if (my !== bookReq) return;
    if (s && s.title) { bookHtml(s); return; }
    loadBookNavigateur(isbn, my);
  });
}
function loadBookNavigateur(isbn, my){
  var box = $("bookBox");
  var none = function(){ return null; };
  Promise.all([fromGoogle(isbn).catch(none), fromBnf(isbn).catch(none), fromOpenLib(isbn).catch(none)]).then(function(rs){
    if (my !== bookReq) return;
    var found = rs.filter(Boolean);
    if (!found.length) {
      var lines = ["Google Books", "BnF", "Open Library"].map(function(n){ return n + " : " + (diag[n] || "?"); }).join(" · ");
      box.innerHTML = '<p class="muted">Livre introuvable dans les bases gratuites : utilise le bouton Google IA ci-dessous.</p><p class="muted" style="font-size:12px">' + lines + '</p>';
      return;
    }
    var b = {};
    ["title","authors","date","publisher","pages","genre","audience","desc","img"].forEach(function(k){
      for (var i = 0; i < found.length; i++) if (found[i][k]) { b[k] = found[i][k]; break; }
    });
    if (/^\d{4}-\d{2}/.test(b.date)) b.date = frDate(b.date);
    if (!b.img) b.img = "https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg?default=false";
    bookHtml(b);
  });
}

var clrArmed = false;
$("clr").onclick = function(){
  if (!clrArmed) { clrArmed = true; $("clr").textContent = "Confirmer ?"; setTimeout(function(){ clrArmed = false; $("clr").textContent = "Tout effacer"; }, 3000); return; }
  clrArmed = false; $("clr").textContent = "Tout effacer"; storeHist([]); renderHist([]);
};

function urlFor(c){
  if (c.indexOf("s:") === 0) return "https://www.google.com/search?q=" + encodeURIComponent(c.slice(2) + " fnac.ch");
  return BASE + encodeURIComponent(c);
}
function show(c){
  var sku = c.indexOf("s:") === 0;
  $("code").textContent = sku ? c.slice(2) : c;
  $("open").href = urlFor(c);
  $("direct").href = "https://www.google.com/search?btnI=1&q=" + encodeURIComponent((sku ? c.slice(2) : c) + " fnac.ch");
  $("open").textContent = sku ? "Chercher ce SKU via Google" : "Ouvrir la fiche fnac.ch";
  $("note").textContent = sku ? "Si le bon produit n’apparaît pas en premier, scanne l’EAN." : "";
  $("res").className = "card";
  saveHist(c);
  $("ai").href = claudeUrl(promptOne(c));
  $("ai").textContent = isBook(c) ? "Résumé détaillé (Google IA)" : "Résumé pour conseiller (Google IA)";
  if (isBook(c)) loadBook(c); else { bookReq++; $("bookBox").className = "hide"; $("bookBox").innerHTML = ""; }
  if (navigator.vibrate) { try { navigator.vibrate(60); } catch(e){} }
}

function eanOk(c){
  if (!/^(\d{8}|\d{12}|\d{13})$/.test(c)) return false;
  var d = c.split("").map(Number), chk = d.pop(), s = 0;
  d.reverse().forEach(function(n, i){ s += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - s % 10) % 10 === chk;
}
var AUTO_KEY = "autoOpen";
try { $("auto").checked = localStorage.getItem(AUTO_KEY) !== "0"; } catch(e){ $("auto").checked = true; }
$("auto").onchange = function(){ try { localStorage.setItem(AUTO_KEY, this.checked ? "1" : "0"); } catch(e){} };

function onScan(text){
  text = String(text).trim();
  if (/^\d{12}$/.test(text)) text = "0" + text;
  if (!eanOk(text)) { $("hint").textContent = "Lecture douteuse (" + text + "), réessaie en cadrant mieux le code."; return false; }
  var now = Date.now();
  if (text === last && now - lastAt < 3000) return;
  last = text; lastAt = now;
  show(text);
  if ($("auto").checked && !isBook(text)) location.href = urlFor(text);
  return true;
}

function scanFile(file){
  if (!file) return;
  if (typeof Html5Qrcode === "undefined") { $("hint").textContent = "Scanner indisponible (bibliothèque non chargée)."; return; }
  $("hint").textContent = "Analyse de la photo…";
  var fr = new Html5Qrcode("filereader", {
    formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A],
    verbose: false
  });
  fr.scanFile(file, false)
    .then(function(t){ last = ""; if (onScan(t) !== false) $("hint").textContent = "Code lu."; })
    .catch(function(){ $("hint").textContent = "Aucun code-barres lisible sur cette photo. Rapproche-toi, évite les reflets et cadre bien le code."; });
}
$("pick").onclick = function(){ $("f2").click(); };
$("f2").onchange = function(){ scanFile(this.files[0]); this.value = ""; };

function goSku(){
  var v = $("sku").value.replace(/\s+/g, "");
  if (!v) return;
  if (/^\d{12}$/.test(v)) v = "0" + v;
  if (/^\d{13}$/.test(v)) { show(v); return; }
  show("s:" + v);
}
$("go").onclick = goSku;
$("sku").addEventListener("keydown", function(e){ if (e.key === "Enter") goSku(); });

function start(){
  if (running) return;
  if (typeof Html5Qrcode === "undefined") { $("hint").textContent = "Scanner indisponible (bibliothèque non chargée)."; return; }
  $("reader").className = "";
  scanner = new Html5Qrcode("reader", {
    formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 120 } }, function(t){ if (onScan(t) !== false) stop(); }, function(){})
    .then(function(){ running = true; $("start").textContent = "Arrêter"; $("hint").textContent = "Vise le code-barres EAN."; setupTorch(); })
    .catch(function(){ $("reader").className = "hide"; $("hint").textContent = "Caméra refusée. Autorise la caméra pour ce site dans les réglages du navigateur, ou choisis une photo existante."; });
}
function stop(){
  if (!running || !scanner) return;
  torchOn = false; $("torch").className = "big alt hide"; $("torch").textContent = "Allumer la lampe";
  scanner.stop().then(function(){ running = false; $("reader").className = "hide"; $("start").textContent = "Scanner en direct"; $("hint").textContent = "Appuie sur « Scanner en direct », puis vise le code-barres."; }).catch(function(){});
}
$("start").onclick = function(){ running ? stop() : start(); };
var torchOn = false;
function torchFeat(){ try { return scanner.getRunningTrackCameraCapabilities().torchFeature(); } catch(e){ return null; } }
function setupTorch(){ var t = torchFeat(); if (t && t.isSupported()) $("torch").className = "big alt"; }
$("torch").onclick = function(){
  var t = torchFeat(); if (!t) return;
  t.apply(!torchOn).then(function(){ torchOn = !torchOn; $("torch").textContent = torchOn ? "Éteindre la lampe" : "Allumer la lampe"; }).catch(function(){});
};
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(function(){}); }
renderHist(loadHist());
</script>
</body>
</html>
